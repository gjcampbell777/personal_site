version: 1
backend:
  phases:
    build:
      commands:
        - npm ci
        - make build-all
        - npx ampx pipeline-deploy --branch master --app-id $AWS_APP_ID

frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
