name: CI/CD for React to AWS Amplify

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  # Testing
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Linter
        run: npm run lint --if-present

      - name: Run Tests
        run: npm test -- --watchAll=false # Ensures CI doesn't hang on watch mode

  # Deployment (Only runs if 'test' passes)
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' 

    steps:
      - name: Trigger webhook using curl
        env:
          WEBHOOK_URL: ${{ secrets.AMPLIFY_WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-Type: application/json" -d '{}' "$WEBHOOK_URL"
