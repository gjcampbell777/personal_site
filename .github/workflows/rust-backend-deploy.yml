name: Rust Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend-rust/**'
      - '.github/workflows/rust-backend-deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust service
        working-directory: backend-rust
        run: cargo build --release

      - name: Deploy placeholder
        run: echo "Deploy the Rust binary or container from this step."
