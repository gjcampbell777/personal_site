name: Go Function Deploy

on:
  push:
    branches: [master]
    paths:
      - 'functions/go/**'
      - '.github/workflows/go-function-deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go service
        working-directory: functions/go
        run: go build ./cmd/api

      - name: Deploy placeholder
        run: echo "Deploy the Go function to AWS Lambda from this step."
