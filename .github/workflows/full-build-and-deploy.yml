name: Full Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  react-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint --if-present

      - name: Run Tests
        run: npm test -- --watchAll=false

  # Deployment (Waits for manual approval after all build jobs pass)
  deploy:
    runs-on: ubuntu-latest
    needs: [react-build]
    environment: production

    steps:
      - name: Trigger webhook using curl
        env:
          WEBHOOK_URL: ${{ secrets.AMPLIFY_WEBHOOK_URL }}
        run: |
          curl -i --fail -X POST -H "Content-Type: application/json" -d '{}' "$WEBHOOK_URL"
