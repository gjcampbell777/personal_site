name: Optimize images

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/assets/**'
      - 'assets/**'
  pull_request:
    paths:
      - 'src/assets/**'
      - 'assets/**'
  workflow_dispatch: {}

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run image optimizer
        run: npm run optimize-images

      - name: Upload optimized images
        uses: actions/upload-artifact@v4
        with:
          name: optimized-images
          path: public/images
