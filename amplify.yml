version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - node -v
            - npm -v
            - npm i -g npm@8
            - npm -v
            - npm install --legacy-peer-deps
            - npm run optimize-images
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: build
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/
