name: Python Function Deploy

on:
  push:
    branches: [master]
    paths:
      - 'functions/python/**'
      - '.github/workflows/python-function-deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: functions/python
        run: pip3 install -r requirements.txt

      - name: Deploy placeholder
        run: echo "Deploy the Python function to AWS Lambda with Mangum from this step."
