name: Test Pipeline Deploy

on:
  push:
    branches: [master]
    paths:
      - 'tests/**'
      - '.github/workflows/test-pipeline-deploy.yml'
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        working-directory: tests/integration
        run: pip3 install -r requirements-test.txt

      - name: Run test pipeline placeholder
        working-directory: tests/integration/integration_tests
        run: python3 test_placeholder.py
